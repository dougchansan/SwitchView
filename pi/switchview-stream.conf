# SwitchView Wi-Fi stream settings. Installed as /etc/default/switchview-stream;
# apply changes with: sudo systemctl restart switchview-stream
# (systemd does not allow comments after a value: keep them on their own line.)

# Capture card. "auto" finds the first USB capture card and the sound card on
# the same USB device. To pick by hand, `v4l2-ctl --list-devices` and
# `arecord -l` show what you have (e.g. /dev/video0, hw:CARD=Video,DEV=0).
VIDEO_DEV=auto
# "none" streams video only.
AUDIO_DEV=auto

# Capture mode. The Pi 4 encoder manages 1280x720@60 or 1920x1080@30.
SIZE=1280x720
FPS=60
# auto picks the best the card offers at SIZE@FPS: nv12, then yuyv422, then
# mjpeg (decoded on the CPU). Or set one of those by hand.
INPUT_FORMAT=auto

# H.264 bitrate. 4-8M suits 720p60 on 5 GHz Wi-Fi; lower it if you see stutter.
BITRATE=6M
# Frames between keyframes: bounds how long a lost packet leaves artefacts.
GOP=60
AUDIO_BITRATE=128k

PORT=39384
# Send rate cap (Mbit/s). Smooths the Pi's big keyframes so a Wi-Fi client's
# router does not drop their middle (a glitch band mid-screen). 0 = no pacing.
PACE_MBPS=80
# Datagrams that may go back to back before pacing applies.
PACE_BURST=4
ENCODER=h264_v4l2m2m
# e.g. yuv420p if the encoder rejects the capture format.
PIX_FMT=
# Extra ffmpeg output arguments for the video stream.
EXTRA_VIDEO_ARGS=
LOGLEVEL=warning
